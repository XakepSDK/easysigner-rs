[package]
name = "kzcrypto-capi"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.100"
description = "C interface to kzcrypto: opaque handles and byte buffers (include/kzcrypto.h)"
repository = "https://github.com/XakepSDK/easysigner-rs"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "kzcrypto_capi"
crate-type = ["staticlib", "cdylib", "lib"]

# std only for the memory allocator, catching panics at the boundary, and the operating
# system's random numbers when the caller passes no random source. The cryptography itself is
# kzcrypto's, which is no_std.
[dependencies]
kzcrypto = { path = "../crypto" }
getrandom = { version = "0.4", features = ["sys_rng"] }
