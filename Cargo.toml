[package]
name = "kzsigner"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.88"
default-run = "kzsigner"
description = "Sign and verify .cms files with Kazakhstan NCA RK keys, locally, without NCALayer"
repository = "https://github.com/XakepSDK/easysigner-rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:wgpu"]

[dependencies]
gost94 = "0.11"
streebog = "0.11"
sha1 = "0.11"
sha2 = "0.11"
digest = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
des = "0.9"
rc2 = "0.9"
aes = "0.9"
cipher = "0.5"
num-bigint = "0.4"
num-traits = "0.2"
getrandom = { version = "0.4", features = ["sys_rng"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
lexopt = "0.3"
rpassword = "7"
eframe = { version = "0.37", optional = true, default-features = false }
ureq = { version = "3.5", default-features = false }
base64 = "0.23"
cbc = "0.2.1"
pkcs12 = { version = "0.2.0-pre.0", default-features = false, features = ["kdf"] }
rsa = { version = "=0.10.0-rc.19", default-features = false, features = ["encoding", "std"] }
lopdf = { version = "0.46", default-features = false }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
qrcodegen = "1.8"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
serde_json = "1"
roxmltree = "0.21"

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { version = "0.17", optional = true, default-features = false, features = ["xdg-portal", "wayland"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.37", optional = true, default-features = false, features = ["android-native-activity", "glow"] }
jni = "0.22"
ndk-context = "0.1"
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }

[target.'cfg(not(any(windows, target_os = "android")))'.dependencies]
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "x11", "wayland"] }
wgpu = { version = "30", optional = true, default-features = false }

[target.'cfg(windows)'.dependencies]
# Direct3D 12, with Windows' own software renderer (WARP) when there is no graphics driver
eframe = { version = "0.37", optional = true, default-features = false, features = ["wgpu_no_default_features"] }
wgpu = { version = "30", optional = true, default-features = false, features = ["dx12", "wgsl", "std"] }
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Globalization"] }

[workspace]
members = ["android"]
default-members = ["."]

# jni-macros 0.22.4 (used by android-activity) writes its generated checks in HashMap order,
# which changes from one build to the next: the Android library was not reproducible. The copy
# in third_party sorts them; see third_party/README.md.
[patch.crates-io]
jni-macros = { path = "third_party/jni-macros" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
egui_kittest = "0.37"

[build-dependencies]
winresource = { version = "0.1", default-features = false }
