[package]
name = "kzsigner"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.100"
description = "Sign and verify .cms files with Kazakhstan NCA RK keys, locally, without NCALayer"
repository = "https://github.com/XakepSDK/easysigner-rs"

[dependencies]
# the cryptography, on its own (no_std): crypto/
kzcrypto = { path = "crypto" }
gost94 = "0.11"
streebog = "0.11"
sha1 = "0.11"
sha2 = "0.11"
digest = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
des = "0.9"
rc2 = "0.9"
aes = "0.9"
cipher = "0.5"
num-bigint = "0.5"
num-traits = "0.2"
getrandom = { version = "0.4", features = ["sys_rng"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ureq = { version = "3.5", default-features = false }
base64 = "0.23"
cbc = "0.2.1"
pkcs12 = { version = "0.2.0-pre.0", default-features = false, features = ["kdf"] }
rsa = { version = "0.10", default-features = false, features = ["encoding", "std", "pkcs1v15"] }
lopdf = { version = "0.47", default-features = false }
ttf-parser = { version = "0.25", default-features = false, features = ["std"] }
qrcodegen = "1.8"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
serde_json = "1"
roxmltree = "0.21"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Globalization"] }

[workspace]
members = ["crypto", "capi", "ffi", "desktop"]
default-members = [".", "crypto", "capi", "desktop"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true


# For mutation testing (cargo mutants, .cargo/mutants.toml): quick to rebuild after a small
# change, with the dependencies (the crypto) optimized, so each run of the tests is short.
[profile.mutants]
inherits = "dev"
debug = false
opt-level = 1

[profile.mutants.package."*"]
opt-level = 3

[dev-dependencies]
# test keys and OCSP answers made to order (ltv tests)
kzcrypto = { path = "crypto", features = ["testkit"] }

# Local test runs (cargo test without --release): the crypto in the dependencies optimized,
# as for mutants, so the GOST and RSA tests don't take minutes.
[profile.dev.package."*"]
opt-level = 3
