# The workspace: crates under crates/ (gost3410, kzcrypto, kzcrypto-nca, kzsigner, kzsigner-ffi,
# der-testkit), apps under apps/ (desktop, android), test files in testdata/.
[workspace]
resolver = "3"
members = [
    "crates/gost3410",
    "crates/kzcrypto",
    "crates/kzcrypto-nca",
    "crates/kzsigner",
    "crates/kzsigner-ffi",
    "crates/der-testkit",
    "apps/desktop",
]
default-members = [
    "crates/gost3410",
    "crates/kzcrypto",
    "crates/kzcrypto-nca",
    "crates/kzsigner",
    "apps/desktop",
]
# vendored crates: dependencies, not ours to lint
exclude = ["third_party"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true


# For mutation testing (cargo mutants, .cargo/mutants.toml): quick to rebuild after a small
# change, with the dependencies (the crypto) optimized, so each run of the tests is short.
[profile.mutants]
inherits = "dev"
debug = false
opt-level = 1

[profile.mutants.package."*"]
opt-level = 3

# Local test runs (cargo test without --release): the crypto in the dependencies optimized,
# as for mutants, so the GOST and RSA tests don't take minutes.
[profile.dev.package."*"]
opt-level = 3

# RustCrypto cms with the OtherRevocationInfoFormat fix (third_party/cms/PATCHED.md)
[patch.crates-io]
cms = { path = "third_party/cms" }
