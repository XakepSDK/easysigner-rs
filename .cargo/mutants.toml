# cargo-mutants (see .github/workflows/quality.yml). Left out: the drawn icons' geometry, the
# window's layout code, and the stamp, Who signed page and document card drawing
# (coordinates, sizes and text placement), which tests can only look at, not check.
exclude_globs = [
    "desktop/src/icons.rs",
    "desktop/src/gui/**",
    "src/pdf/card.rs",
    "src/pdf/stamp.rs",
    "src/pdf/layout.rs",
    "src/pdf/whosigned.rs",
]
profile = "mutants"
