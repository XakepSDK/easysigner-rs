# cargo deny (see .github/workflows/quality.yml, job "deps"): known vulnerabilities, unmaintained
# crates, duplicate versions and where crates come from. Licenses are not checked yet: the
# repository has no license of its own to check against.

[graph]
all-features = false

[advisories]
# Unmaintained crates we depend on directly fail the check. Nothing is ignored.
unmaintained = "workspace"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
