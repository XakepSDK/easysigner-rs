[package]
name = "kzsigner"
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.100"
description = "Sign and verify .cms files with Kazakhstan NCA RK keys, locally, without NCALayer"
repository = "https://github.com/XakepSDK/easysigner-rs"

[dependencies]
# the cryptography, on its own (no_std): crates/kzcrypto
kzcrypto = { path = "../kzcrypto", version = "0.1.0-dev" }
# NCA RK's CA certificates, TSA policies, signing rules and tolerances
kzcrypto-nca = { path = "../kzcrypto-nca", version = "0.1.0-dev" }
der = { version = "=0.8.3", default-features = false, features = ["alloc", "oid", "ber", "derive"] }
spki = { version = "0.8", default-features = false, features = ["alloc"] }
getrandom = { version = "0.4", features = ["sys_rng"] }
# dates and the local time zone (the system's zone database; Windows: the bundled one)
jiff = "0.2"
ureq = { version = "3.5", default-features = false }
base64 = "0.23"
lopdf = { version = "0.47", default-features = false }
# glyph map and metrics of the stamp font (the same crate the GUI text stack uses)
skrifa = { version = "0.44", default-features = false, features = ["std"] }
qrcodegen = "1.8"
flate2 = "1"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
serde_json = "1"
roxmltree = "0.21"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "alloc", "zeroize"] }
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Globalization"] }

[dev-dependencies]
# test keys and OCSP answers made to order (ltv tests)
kzcrypto = { path = "../kzcrypto", features = ["testkit"] }
# hand-made DER for the tests
der-testkit = { path = "../der-testkit" }
