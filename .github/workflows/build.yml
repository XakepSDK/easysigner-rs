# Builds and tests on Linux and Windows: unit tests, the end-to-end checks (tests/e2e.rs), the
# scripted window test (tests/gui.rs), and a real window start. Release builds are reproducible
# (scripts/cargo.sh): each commit is built a second time in another folder and the executables
# must be byte-identical. A push to main whose Cargo.toml
# version has no pre-release suffix (no "-") publishes the downloads as GitHub release vX.Y.Z,
# with release-notes/X.Y.Z.md.
#
# To save CI minutes: commits that only touch documentation start nothing, a newer push
# cancels the run still going for the same branch, and the Android job (APK, rebuild check,
# emulator) runs only when the app's Android parts, the window, the crates or this file
# change, for a release, or when started by hand (Actions > build > Run workflow).
name: build
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE*']
  workflow_dispatch:
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.c.outputs.android }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 100
      - id: c
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          V=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          android=true
          case "$V" in *-*)
            if [ "${{ github.event_name }}" != workflow_dispatch ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git diff --name-only "$BEFORE" HEAD | tee changed.txt
              grep -qE '^(android/|src/android\.rs|src/gui\.rs|src/i18n\.rs|scripts/apk\.sh|scripts/cargo\.sh|Cargo\.(toml|lock)|rust-toolchain\.toml|\.github/workflows/)' changed.txt || android=false
            fi ;;
          esac
          echo "android=$android" | tee -a "$GITHUB_OUTPUT"
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Version from Cargo.toml
        id: version
        shell: bash
        run: echo "version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Rust (the version pinned in rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Linux libraries (file dialogs, virtual display for the window check)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb weston libxkbcommon-x11-0 libgl1-mesa-dri libegl1 libwayland-egl1
      - name: Test
        shell: bash
        run: sh scripts/cargo.sh test --release --locked
      - name: Build
        shell: bash
        run: sh scripts/cargo.sh
      - name: Same executables when built again in another folder
        shell: bash
        run: |
          git clone -q . "$RUNNER_TEMP/again"
          (cd "$RUNNER_TEMP/again" && sh scripts/cargo.sh)
          for f in kzsigner; do
            [ "$RUNNER_OS" = Windows ] && f=$f.exe
            sha256sum "target/release/$f" "$RUNNER_TEMP/again/target/release/$f"
            cmp "target/release/$f" "$RUNNER_TEMP/again/target/release/$f" || {
              echo "Differing build outputs:"
              (cd target/release && find deps build -type f \( -name '*.rlib' -o -name '*.a' -o -name 'output' \) | sort) |
                while read -r x; do cmp -s "target/release/$x" "$RUNNER_TEMP/again/target/release/$x" || echo "  $x"; done
              exit 1
            }
          done
      - name: Window opens and keeps running (Linux)
        if: runner.os == 'Linux'
        run: |
          set +e
          # links nothing beyond the C library (no GTK): X11, Wayland and OpenGL are loaded at run time
          ldd target/release/kzsigner
          ! ldd target/release/kzsigner | grep -v 'linux-vdso\|libc\.so\|libm\.so\|libgcc_s\|ld-linux' || exit 1
          # X11
          timeout 8 xvfb-run -a target/release/kzsigner gui > gui.log 2>&1
          r=$?
          cat gui.log
          [ $r -eq 124 ] || exit 1
          # native Wayland (a headless Weston, no X server)
          export XDG_RUNTIME_DIR=$(mktemp -d); chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless --socket=wl-ci --idle-time=0 > weston.log 2>&1 &
          sleep 3
          env -u DISPLAY WAYLAND_DISPLAY=wl-ci WAYLAND_DEBUG=1 timeout 8 target/release/kzsigner gui > wl.log 2>&1
          r=$?
          kill %1
          grep -m3 'set_app_id\|set_title' wl.log
          [ $r -eq 124 ] && grep -q 'set_app_id("kzsigner")' wl.log
      - name: Window opens and keeps running (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -PassThru -FilePath target\release\kzsigner.exe -ArgumentList gui
          Start-Sleep -Seconds 8
          if ($p.HasExited) { Write-Error "the window closed with exit code $($p.ExitCode)"; exit 1 }
          # started like a double-click, it must not keep a console window (conhost) of its own
          [Environment]::OSVersion.Version
          $con = Get-CimInstance Win32_Process -Filter "ParentProcessId=$($p.Id)" | Where-Object { $_.Name -match 'conhost|OpenConsole' }
          if ($con) { Write-Error "kzsigner still has a console window"; Stop-Process -Id $p.Id; exit 1 }
          Stop-Process -Id $p.Id
      - name: Package
        shell: bash
        run: |
          V=${{ steps.version.outputs.version }}
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          mkdir -p dist
          if [ "$RUNNER_OS" = Windows ]; then
            D="kzsigner-$V-windows-x64"; mkdir "$D"
            cp target/release/kzsigner.exe README.md "$D/"
            # a console program: output, and the exit code
            "$D/kzsigner.exe" --version | tee version.txt
            grep -q "$V" version.txt
            set +e; "$D/kzsigner.exe" verify missing.cms; r=$?; set -e
            [ $r -eq 1 ]
            touch -d "@$SOURCE_DATE_EPOCH" "$D" "$D"/*
            (cd "$D" && sha256sum kzsigner.exe) > "dist/$D.sha256"
            7z a -bd -mx=9 "dist/$D.zip" "$D/kzsigner.exe" "$D/README.md" >/dev/null
          else
            D="kzsigner-$V-linux-x64"; mkdir "$D"
            cp target/release/kzsigner README.md assets/kzsigner.png packaging/linux/kzsigner.desktop packaging/linux/install.sh "$D/"
            chmod 755 "$D/kzsigner" "$D/install.sh"; chmod 644 "$D/README.md" "$D/kzsigner.png" "$D/kzsigner.desktop"
            touch -d "@$SOURCE_DATE_EPOCH" "$D" "$D"/*
            (cd "$D" && sha256sum kzsigner) > "dist/$D.sha256"
            tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cf - "$D" | xz -9 -T1 > "dist/$D.tar.xz"
          fi
          (cd dist && sha256sum "$D".zip "$D".tar.xz 2>/dev/null || true) >> "dist/$D.sha256"
          cat "dist/$D.sha256"
          ls -la dist "$D"
      # Build provenance (gh attestation verify FILE -R XakepSDK/easysigner-rs). GitHub only
      # stores attestations for public repositories (private ones need Enterprise Cloud), so
      # the step is skipped while the repository is private.
      - name: Attest build provenance
        if: github.event.repository.private == false && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/kzsigner-*.zip
            dist/kzsigner-*.tar.xz
            ${{ runner.os == 'Windows' && 'target/release/kzsigner.exe' || 'target/release/kzsigner' }}
      - uses: actions/upload-artifact@v4
        with:
          name: kzsigner-${{ runner.os }}-x64
          path: dist/
  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust (the version pinned in rust-toolchain.toml) with the Android targets
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android
      - name: Android SDK parts (pinned)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.2.12479018" "build-tools;35.0.0" "platforms;android-35" > /dev/null
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Build the APK
        run: sh scripts/apk.sh
      - name: Same APK when built again in another folder
        id: again
        continue-on-error: true
        run: |
          git clone -q . "$RUNNER_TEMP/again"
          (cd "$RUNNER_TEMP/again" && sh scripts/apk.sh > /dev/null)
          sha256sum dist/*.apk "$RUNNER_TEMP"/again/dist/*.apk
          cmp target/apk/unsigned.apk "$RUNNER_TEMP/again/target/apk/unsigned.apk" || {
            unzip -lv target/apk/unsigned.apk; unzip -lv "$RUNNER_TEMP/again/target/apk/unsigned.apk"
            for f in $(cd target/apk && find classes.dex lib dex classes res.zip base.apk -type f | sort); do
              cmp -s "target/apk/$f" "$RUNNER_TEMP/again/target/apk/$f" || echo "differs: $f"
            done
            exit 1
          }
          cmp dist/*.apk "$RUNNER_TEMP"/again/dist/*.apk
      - name: Disk space for the emulator (the builds above leave little)
        run: |
          rm -rf "$RUNNER_TEMP/again"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/node_modules /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache/CodeQL
          df -h /
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The app starts on an emulator and keeps running
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          disk-size: 2048M
          script: |
            adb install -r dist/*.apk
            adb shell am start -W -n kz.kzsigner/.MainActivity
            sleep 20
            adb exec-out screencap -p > android-start.png
            adb logcat -d -s kzsigner:* RustStdoutStderr:* AndroidRuntime:* DEBUG:* libc:* | tail -60
            adb shell pidof kz.kzsigner
      - name: The second build must have matched (checked above)
        if: steps.again.outcome != 'success'
        run: exit 1
      - name: Checksum
        run: (cd dist && sha256sum *.apk) | tee "dist/kzsigner-android.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: kzsigner-android
          path: dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-screenshot
          path: android-start.png
          if-no-files-found: ignore
  release:
    if: github.ref == 'refs/heads/main' && !contains(needs.build.outputs.version, '-')
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kzsigner-*
          merge-multiple: true
      - name: Publish the release (once per version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=${{ needs.build.outputs.version }}
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V already released"; exit 0; fi
          cat dist/*.sha256 > dist/SHA256SUMS && rm dist/*.sha256
          gh release create "v$V" --target "$GITHUB_SHA" --title "kzsigner $V" --notes-file "release-notes/$V.md" dist/*
