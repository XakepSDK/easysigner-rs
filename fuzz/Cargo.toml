# Fuzzing (cargo fuzz, nightly): random and mutated files fed to what reads untrusted input, to
# find crashes (panics, overflows, endless loops) that tests with real files don't reach.
#
#   cargo +nightly fuzz run verify -- -max_total_time=60
#
# Seeds come from testdata (fuzz/seed.sh copies them into fuzz/corpus/<target>).
[package]
name = "kzsigner-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
kzsigner = { path = "../crates/kzsigner" }
kzcrypto = { path = "../crates/kzcrypto" }
kzcrypto-nca = { path = "../crates/kzcrypto-nca" }

# not part of the main workspace: it needs nightly and libFuzzer
[workspace]
members = ["."]

[[bin]]
name = "verify"
path = "fuzz_targets/verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "open_key"
path = "fuzz_targets/open_key.rs"
test = false
doc = false
bench = false

[[bin]]
name = "extract"
path = "fuzz_targets/extract.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cert"
path = "fuzz_targets/cert.rs"
test = false
doc = false
bench = false

[[bin]]
name = "crl"
path = "fuzz_targets/crl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ocsp"
path = "fuzz_targets/ocsp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tsp"
path = "fuzz_targets/tsp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "cms"
path = "fuzz_targets/cms.rs"
test = false
doc = false
bench = false

# the same patched cms as the main workspace (third_party/cms/PATCHED.md)
[patch.crates-io]
cms = { path = "../third_party/cms" }
